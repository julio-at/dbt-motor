volumes:
  motor-health-data:
    driver: local
  motor-health-db:
    driver: local

services:
  dashboard:
    image: motor-health-lab
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motor-health-app
    ports:
      - "8501:8501"
    volumes:
      - motor-health-data:/workspace/data
      - motor-health-db:/workspace
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_PORT: 8501
    command: streamlit run app/streamlit_app.py
