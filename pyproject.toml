[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-health-lab"
version = "1.0.0"
description = "Educational condition monitoring lab for industrial motors"
requires-python = ">=3.11"

dependencies = [
  "dbt-core>=1.8.0",
  "dbt-duckdb>=1.8.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "pytest>=7.0.0",
  "streamlit>=1.28.0",
  "pytz",
]

[tool.uv]
python-version = "3.11"
